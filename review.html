<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>方案批注 · Review Desk</title>
<link rel="stylesheet" href="/_preview/theme.css"><body class="review-page">
<header class="review-header"><h1>方案批注 <small>Review Desk</small></h1><a href="/">所有方案</a><select id="pages" aria-label="选择方案"></select><span class="muted">划词 → 批注 → 汇总复制</span></header>
<main class="workspace"><section class="preview"><div class="muted" id="source"></div><iframe id="page" title="待审查方案"></iframe></section><aside><div class="eyebrow">Your review notes</div>
<div id="round" class="tag"></div><div id="update" hidden><p id="updateText"></p><button id="next" class="primary">开始新一轮</button></div><h2>添加审查意见</h2><div class="muted">在左侧选中文字，点击「批注」。已批注文字以浅黄色标出，也可以直接写整体意见。</div><div id="quote"></div><textarea id="note" rows="4" placeholder="希望如何修改？为什么？" aria-label="批注内容"></textarea><div class="actions"><button class="primary" id="save">保存批注</button><button id="cancel">取消选段</button></div>
<h2>批注清单 <span id="count">0</span></h2><div id="status" role="status"></div><div id="list"></div><button class="primary" id="export">汇总并复制</button>
<details id="history"><summary>历史批注 <span id="historyCount">0</span></summary><div id="archives"></div></details><details><summary>打开其他预览页</summary><p class="muted">粘贴本站方案 URL 或 HTML / Markdown 文件名。</p><div class="urlrow"><input id="url" aria-label="方案地址" placeholder="方案 URL / 文件名"><button id="open">打开</button></div></details><small>批注按方案地址和审查轮次保存在当前浏览器。</small>
</aside></main><button id="pick" class="primary">＋ 批注</button>
<dialog id="dialog"><h2>提交给 Codex 的审查意见</h2><p class="muted">复制后粘贴到终端对话。包含方案来源、引用原文和修改意见。</p><textarea id="output" aria-label="汇总文本"></textarea><div id="copyStatus" role="status"></div><div class="actions"><button class="primary" id="copy">再次复制</button><button id="close">关闭</button></div></dialog>
<script>

const $=id=>document.getElementById(id), frame=$('page');
let current='', title='', entries=[], pending=null, editing=null, selected=null, frameDoc=null;
function status(s){$('status').textContent=s}
function key(){return 'review-desk:v1:'+current}
let review={round:1,revision:null,archives:[]}, latest=null, displayedRevision=null, generation=0, checking=false;
function persist(){try{localStorage.setItem(key(),JSON.stringify({...review,entries}));status('已保存到当前浏览器');return true}catch(e){status('浏览器无法保存；请在关闭页面前汇总复制');return false}}
function versionUI(){
  $('round').textContent=`第 ${review.round} 轮审查`;
  const changed=latest&&review.revision!==latest.revision;
  $('update').hidden=!changed;
  $('updateText').textContent=`文档已更新，本轮有 ${entries.length} 条批注。开始新一轮后，旧意见将归档，供逐条核对。`;
  $('historyCount').textContent=review.archives.reduce((n,a)=>n+a.entries.length,0);
  $('archives').replaceChildren();
  for(const archive of [...review.archives].reverse()){
    const heading=document.createElement('p');heading.className='tag';heading.textContent=`第 ${archive.round} 轮 · ${archive.revision?.slice(0,12)||'旧版未记录版本'} · ${new Date(archive.archivedAt).toLocaleString()}`;$('archives').append(heading);
    for(const entry of archive.entries){
      const card=document.createElement('div');card.className='card history-card';
      const label=document.createElement('div');label.className='tag';label.textContent=entry.resolved?'已解决':'待核对';card.append(label);
      if(entry.quote){const q=document.createElement('blockquote');q.textContent=entry.quote;card.append(q)}
      const note=document.createElement('p');note.textContent=entry.note;card.append(note);
      const resolve=document.createElement('button');resolve.textContent=entry.resolved?'恢复待核对':'标记已解决';resolve.onclick=()=>{entry.resolved=!entry.resolved;persist();versionUI()};
      const follow=document.createElement('button');follow.textContent='继续跟进';follow.onclick=()=>{
        if($('note').value.trim()){status('请先保存当前草稿，或取消选段');return}
        if(!frameDoc||displayedRevision!==review.revision){status('请先开始新一轮，再继续跟进');return}
        reset();$('note').value=entry.note;
        if(entry.quote){const text=textIndex(frameDoc).text,exact=entry.anchor?.text||entry.quote,start=text.indexOf(exact);
          if(start>=0&&text.indexOf(exact,start+1)===-1){pending={quote:entry.quote,section:entry.section,anchor:{start,text:exact}};$('quote').textContent=entry.quote;status('已带入意见，保存后加入本轮')}
          else{pending={needsSelection:true};$('quote').textContent='旧引用无法唯一定位，请在当前正文重新选段。';status('请重新选段，意见已保留')}
        }else status('已带入整体意见，保存后加入本轮');
        $('note').focus();
      };card.append(resolve,document.createTextNode(' '),follow);$('archives').append(card);
    }
  }
}
function displayDocument(snapshot){
  frameDoc=null;displayedRevision=snapshot.revision;
  const doc=new DOMParser().parseFromString(snapshot.html,'text/html');
  const base=document.createElement('base');base.href=current;doc.head.prepend(base);
  frame.srcdoc='<!doctype html>'+doc.documentElement.outerHTML;
}
async function checkDocument(show=false,force=false){
  const token=generation,url=current;
  if(!url||checking&&!show&&!force)return;
  checking=true;
  try{
    const response=await fetch('/_preview/document?page='+encodeURIComponent(new URL(url).pathname+new URL(url).search),{cache:'no-store'});
    if(!response.ok)throw Error();const snapshot=await response.json();if(token!==generation)return;
    latest=snapshot;
    if(!review.revision){review.revision=snapshot.revision;persist()}
    if(show)displayDocument(snapshot);
    versionUI();
    return snapshot;
  }catch(e){if(token===generation)status('文档读取失败，请稍后重新检查')}
  finally{checking=false}
}
$('next').onclick=async()=>{
  if($('note').value.trim()){status('请先保存当前批注，或点击取消选段放弃草稿');return}
  const token=generation,snapshot=await checkDocument(false,true);
  if(!snapshot||token!==generation||snapshot.revision===review.revision)return;
  const previous=review,previousEntries=entries;
  review={round:review.round+1,revision:latest.revision,archives:[...review.archives,{round:review.round,revision:review.revision,archivedAt:Date.now(),entries:entries.map(e=>({...e}))}]};entries=[];
  if(!persist()){review=previous;entries=previousEntries;return}
  reset();displayDocument(latest);render();status('已开始新一轮，上一轮意见已归档');
};
// 使用浏览器原生高亮，保留原文 DOM 和划词行为。
function textIndex(doc){
  const nodes=[], walker=doc.createTreeWalker(doc.body,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest('script,style,noscript')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  let text='', node;
  while(node=walker.nextNode()){nodes.push({node,start:text.length});text+=node.data}
  return {nodes,text};
}
function anchorRange(range){
  const {nodes}=textIndex(frameDoc);
  const before=frameDoc.createRange();before.selectNodeContents(frameDoc.body);before.setEnd(range.startContainer,range.startOffset);
  let start=0;
  for(const {node} of nodes){if(before.comparePoint(node,node.length)<=0)start+=node.length;else{if(before.comparePoint(node,0)<=0)start+=range.startOffset;break}}
  return {start,text:range.toString()};
}
function renderHighlights(){
  if(!frameDoc?.defaultView?.CSS?.highlights)return;
  const {nodes,text}=textIndex(frameDoc), ranges=[];
  for(const entry of displayedRevision===review.revision?entries:[]){
    if(!entry.quote)continue;
    const exact=entry.anchor?.text||entry.quote;
    let start=entry.anchor?.start;
    if(!Number.isInteger(start)||text.slice(start,start+exact.length)!==exact){
      start=text.indexOf(exact);
      // 旧批注或原文变动时，只恢复能够唯一定位的选段。
      if(start<0||text.indexOf(exact,start+1)!==-1)continue;
    }
    const end=start+exact.length;
    const first=nodes.find(x=>x.start+x.node.length>start), last=nodes.find(x=>x.start+x.node.length>=end);
    if(!first||!last)continue;
    const range=frameDoc.createRange();range.setStart(first.node,start-first.start);range.setEnd(last.node,end-last.start);ranges.push(range);
  }
  frameDoc.defaultView.CSS.highlights.set('review-desk-notes',new frameDoc.defaultView.Highlight(...ranges));
}
function reset(){pending=null;editing=null;$('quote').textContent='';$('note').value='';$('save').textContent='保存批注'}
function render(){ $('count').textContent=entries.length;$('list').replaceChildren();if(!entries.length){const p=document.createElement('p');p.className='empty';p.textContent='尚无批注，选一段文字开始。';$('list').append(p)}entries.forEach((e,i)=>{const card=document.createElement('div');card.className='card';const tag=document.createElement('div');tag.className='tag';tag.textContent=`${i+1} · ${e.section||'整体意见'}`;card.append(tag);if(e.quote){const q=document.createElement('blockquote');q.textContent=e.quote;card.append(q)}const p=document.createElement('p');p.textContent=e.note;card.append(p);const edit=document.createElement('button');edit.textContent='编辑';edit.onclick=()=>{editing=e.id;pending={quote:e.quote,section:e.section,anchor:e.anchor};$('quote').textContent=e.quote;$('note').value=e.note;$('save').textContent='保存修改';$('note').focus()};const del=document.createElement('button');del.textContent='删除';del.onclick=()=>{entries=entries.filter(x=>x.id!==e.id);if(editing===e.id)reset();persist();render()};card.append(edit,document.createTextNode(' '),del);$('list').append(card)});renderHighlights();versionUI()}
function openPage(value){let u;try{u=new URL(value,location.origin+'/');if(u.pathname==='/_review')u=new URL(u.searchParams.get('page')||'',location.origin+'/');if(u.origin!==location.origin||!/\.(html?|md|markdown)$/i.test(u.pathname))throw Error()}catch(e){status('请输入本站 HTML 或 Markdown 方案地址');return}if($('note').value.trim()){status('请先保存当前批注，或点击取消选段放弃草稿');$('pages').value=current;return}u.hash='';current=u.href;generation++;latest=null;displayedRevision=null;title='';frameDoc=null;reset();selected=null;$('pick').style.display='none';review={round:1,revision:null,archives:[]};try{const data=JSON.parse(localStorage.getItem(key())||'[]');if(Array.isArray(data))entries=data;else{review={round:data.round||1,revision:data.revision||null,archives:data.archives||[]};entries=data.entries||[]}entries=entries.filter(e=>e&&typeof e.note==='string'&&typeof e.quote==='string')}catch(e){entries=[]}if(!Array.from($('pages').options).some(o=>o.value===current))$('pages').add(new Option(decodeURIComponent(u.pathname.split('/').pop()),current));$('pages').value=current;$('source').textContent=decodeURIComponent(u.pathname.split('/').pop());const address=new URL(location.href);address.searchParams.set('page',u.pathname+u.search);history.replaceState(null,'',address);status('');render();checkDocument(true)}
frame.addEventListener('load',()=>{try{const doc=frame.contentDocument;if(!doc||!doc.body)throw Error();frameDoc=doc;const style=doc.createElement('style');style.textContent='::highlight(review-desk-notes){background-color:rgba(250,204,21,.28);text-decoration:underline;text-decoration-color:#b88716;text-decoration-thickness:1px;text-underline-offset:3px}';doc.head.append(style);renderHighlights();doc.addEventListener('click',e=>{const a=e.target.closest?.('a[href]');if(!a||e.ctrlKey||e.metaKey||e.shiftKey||e.altKey||a.target==='_blank'||a.hasAttribute('download'))return;const target=new URL(a.href);const active=new URL(current);if(target.pathname===active.pathname&&target.search===active.search&&target.hash){e.preventDefault();doc.getElementById(decodeURIComponent(target.hash.slice(1)))?.scrollIntoView();return}if(target.origin===location.origin&&/\.(html?|md|markdown)$/i.test(target.pathname)&&(target.pathname!==active.pathname||target.search!==active.search)){e.preventDefault();openPage(target.href)}});title=doc.title||$('source').textContent;doc.addEventListener('selectionchange',()=>{$('pick').style.display='none'});const capture=()=>{const s=doc.getSelection();if(!s||s.isCollapsed||!s.toString().trim())return;const range=s.getRangeAt(0);let section='';for(const h of doc.querySelectorAll('h1,h2,h3,h4')){if(h===s.anchorNode.parentElement||(h.compareDocumentPosition(range.startContainer)&Node.DOCUMENT_POSITION_FOLLOWING))section=h.textContent.trim()}selected={quote:s.toString().trim(),section,anchor:anchorRange(range)};const r=range.getBoundingClientRect(),f=frame.getBoundingClientRect();$('pick').style.left=Math.max(8,Math.min(f.left+r.left,innerWidth-110))+'px';$('pick').style.top=Math.max(8,Math.min(f.top+r.bottom+6,innerHeight-50))+'px';$('pick').style.display='block'};doc.addEventListener('pointerup',()=>setTimeout(capture,20));doc.addEventListener('keyup',()=>setTimeout(capture,20));doc.addEventListener('scroll',()=>{$('pick').style.display='none'},true)}catch(e){status('无法读取该页面，请使用同站点的方案文件')}});
$('pick').onpointerdown=e=>e.preventDefault();$('pick').onclick=()=>{if(editing||$('note').value.trim()&&!pending?.needsSelection){status('请先保存当前意见，再添加新的选段');return}pending=selected;$('quote').textContent=pending.quote;$('pick').style.display='none';$('note').focus()};
$('save').onclick=()=>{if(pending?.needsSelection){status('请先在当前正文重新选择引用原文');return}if(!frameDoc||displayedRevision!==review.revision){status('文档已更新，请先开始新一轮；草稿可先复制留存后取消');return}const note=$('note').value.trim();if(!note){status('请先填写批注内容');$('note').focus();return}const entry={id:editing||String(Date.now())+Math.random(),quote:pending?.quote||'',section:pending?.section||'',anchor:pending?.anchor,note};if(editing)entries=entries.map(e=>e.id===editing?entry:e);else entries.push(entry);persist();reset();render()};$('cancel').onclick=()=>{reset();status('已取消当前草稿')};
function summary(){return ['请根据以下审查意见修改方案；如有冲突或不明确之处，请指出。','',`方案：${title||$('source').textContent}`,`来源：${current}`,`审查轮次：第 ${review.round} 轮`,`内容版本：${review.revision||'未记录'}`,'',...entries.flatMap((e,i)=>[`## ${i+1}. ${e.section||'整体意见'}`,e.quote?'引用原文：\n'+e.quote.split('\n').map(s=>'> '+s).join('\n'):'',`我的意见：${e.note}`,''])].join('\n')}
async function copy(){const out=$('output');let ok=false;try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(out.value);ok=true}}catch(e){}if(!ok){out.focus();out.select();try{ok=document.execCommand('copy')}catch(e){}}$('copyStatus').textContent=ok?'已复制，可以粘贴到 Codex CLI。':'未能自动复制，文本已选中，请按 Ctrl+C / ⌘C。'}
$('export').onclick=()=>{if($('note').value.trim()){status('还有未保存的意见，请先保存再汇总');return}if(!entries.length){status('请先添加一条批注');return}$('output').value=summary();$('dialog').showModal();copy()};$('copy').onclick=copy;$('close').onclick=()=>$('dialog').close();$('open').onclick=()=>openPage($('url').value);$('pages').onchange=()=>openPage($('pages').value);
async function refreshPages(start=false){try{const response=await fetch('/_preview/files',{cache:'no-store'});if(!response.ok)throw Error();const files=await response.json();$('pages').replaceChildren();for(const f of files)$('pages').add(new Option(f.name,new URL(f.url,location.origin).href));if(current){if(!Array.from($('pages').options).some(o=>o.value===current))$('pages').add(new Option(decodeURIComponent(new URL(current).pathname),current));$('pages').value=current}if(start){const target=new URL(location.href).searchParams.get('page')||files[0]?.url;if(target)openPage(target);else status('暂无方案，请将 HTML 或 Markdown 放入 preview 目录')}}catch(e){status('方案列表加载失败，请刷新重试')}}
window.addEventListener('focus',()=>{refreshPages();checkDocument()});document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkDocument()});setInterval(()=>{if(!document.hidden){refreshPages();checkDocument()}},15000);refreshPages(true);
</script></html>
