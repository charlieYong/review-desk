<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一次更清晰的方案审查</title><style>body{max-width:760px;margin:64px auto;padding:0 24px;font:17px/1.8 system-ui,sans-serif;color:#203b33;background:#fffefa}h1{font-size:36px;line-height:1.3}h2{margin-top:36px;font-size:22px}small,a{color:#23654f}blockquote{border-left:3px solid #91b097;margin:24px 0;padding:12px 24px;background:#edf3ec}</style><small>REVIEW DESK / HTML 示例</small><h1>一次更清晰的方案审查</h1><p>这是一份普通 HTML。无需注入批注脚本，审查工作台即可读取正文中的选段。</p><h2>从具体的文字开始</h2><p>与其只说“这个方案需要调整”，不如选中一段原文，指出缺失的条件、模糊的定义或可以精简的步骤。</p><blockquote>选中这句话，留下一条你的意见。</blockquote><h2>让修改可以继续</h2><p>完成审查后，一次复制全部意见。每条意见都带有对应原文，接手的人或 Agent 可以直接定位问题。</p><a href="README.md">阅读 Markdown 示例 →</a></html>
