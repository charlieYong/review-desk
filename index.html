<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>方案书桌 · Review Desk</title><link rel="stylesheet" href="/_preview/theme.css"><header class="topbar"><a class="brand" href="/"><span class="brand-mark">≋</span> Review Desk</a><span class="online">预览与批注 · 自动同步</span></header><main class="library"><section class="hero"><div><div class="eyebrow">A space for thoughtful review</div><h1>让每个想法，再清晰一点。</h1><p>阅读方案，留下批注，把修改意见一次带回对话。</p></div><div class="hero-side"><strong id="total">—</strong><span>份方案，等待好想法</span></div></section><div class="tools"><input id="search" aria-label="搜索方案或填写本机路径" placeholder="搜索方案名称或项目目录，或填写本机绝对路径…"><button id="openLocal">打开批注</button><button id="refresh">↻ 刷新列表</button></div><p id="localStatus" class="local-status" role="status">项目方案保留在项目目录，填写服务所在机器上的绝对路径即可审查，无需复制。</p><div class="filters availability" aria-label="方案状态"><button data-availability="active" aria-pressed="true">有效方案 <span id="activeCount">0</span></button><button data-availability="missing" aria-pressed="false">失效方案 <span id="missingCount">0</span></button></div><div class="list-heading"><div class="filters" aria-label="文件类型"><button data-kind="all" aria-pressed="true">全部</button><button data-kind="HTML" aria-pressed="false">HTML</button><button data-kind="Markdown" aria-pressed="false">Markdown</button></div><span class="sort-label">↓ 最近更新优先</span><p id="status" role="status"></p></div><section id="list"></section><footer><span>选择方案开始批注 · 支持 HTML / Markdown</span><span>目录内自动发现 · 外部方案定位或打开后收录 · 每 15 秒更新</span></footer></main><script>
let files=[],kind='all',availability='active';const $=id=>document.getElementById(id);
function render(){
  const active=files.filter(f=>f.available!==false),missing=files.filter(f=>f.available===false);
  const group=availability==='active'?active:missing;
  const shown=group.filter(f=>(kind==='all'||f.kind===kind)&&f.name.toLowerCase().includes($('search').value.toLowerCase()));
  $('total').textContent=active.length;$('activeCount').textContent=active.length;$('missingCount').textContent=missing.length;
  document.querySelector('.sort-label').textContent=availability==='active'?'↓ 最近更新优先':'按路径排序 · 批注记录保留';
  $('list').replaceChildren();
  for(const f of shown){
    const available=f.available!==false,row=document.createElement('article'),icon=document.createElement('span'),info=document.createElement('div'),link=document.createElement(available?'a':'span'),meta=document.createElement('small'),time=document.createElement('time'),raw=document.createElement(available?'a':'span');
    row.className='file-row';icon.className='file-icon'+(f.kind==='Markdown'?' md':'');icon.textContent=f.kind==='Markdown'?'MD':'HTML';info.className='file-info';link.className='file-title';
    if(available)link.href='/_review?page='+encodeURIComponent(f.url);
    link.textContent=f.name.split('/').pop();meta.textContent=(f.name.includes('/')?f.name.slice(0,f.name.lastIndexOf('/'))+' · ':'')+f.kind;
    time.className='file-date';
    if(available){const date=new Date(f.modified*1000);time.dateTime=date.toISOString();time.textContent=date.toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false});time.title='修改时间：'+date.toLocaleString('zh-CN');raw.href=f.url;raw.textContent='预览 ↗'}
    else{meta.textContent+=' · 文件不存在或暂时不可访问，恢复后可继续审查';raw.textContent='文件不可用'}
    raw.className='raw';info.append(link,meta);row.append(icon,info,time,raw);$('list').append(row);
  }
  $('status').textContent=`${shown.length} / ${group.length} 份${availability==='active'?'有效':'失效'}方案`;
  if(!shown.length){const empty=document.createElement('p');empty.className='empty';empty.textContent=group.length?'没有匹配的方案，试试其他关键词。':availability==='missing'?'没有失效方案。':'还没有方案，将 HTML 或 Markdown 放入内容目录，或在上方填写本机绝对路径。';$('list').append(empty)}
}
async function refresh(){try{const r=await fetch('/_preview/files',{cache:'no-store'});const data=await r.json();if(!r.ok)throw Error(data.error||'列表加载失败，请刷新重试。');files=data;files.sort((a,b)=>a.available===false&&b.available===false?a.name.localeCompare(b.name):b.modified-a.modified||a.name.localeCompare(b.name));render()}catch(e){$('status').textContent=e.message||'列表加载失败，请刷新重试。'}}
async function openLocal(){const path=$('search').value.trim();if(!path){$('localStatus').textContent='请填写本机方案的绝对路径';return}$('localStatus').textContent='正在打开…';try{const r=await fetch('/_preview/locate?path='+encodeURIComponent(path),{cache:'no-store'});if(!r.ok){if(r.status===500)throw Error((await r.json()).error);throw Error('找不到该方案，请确认绝对路径指向本机 HTML 或 Markdown 文件')}const {page}=await r.json();location.href='/_review?page='+encodeURIComponent(page)}catch(e){$('localStatus').textContent=e.message||'打开失败，请稍后重试'}}
function looksLikeLocalPath(v){const s=v.trim();return /^(~|file:|[A-Za-z]:[\\/])/.test(s)||s.startsWith('/')&&s.split('/').filter(Boolean).length>=2}
$('search').oninput=render;$('search').addEventListener('keydown',e=>{if(e.key==='Enter'&&looksLikeLocalPath($('search').value))openLocal()});$('refresh').onclick=refresh;$('openLocal').onclick=openLocal;
for(const b of document.querySelectorAll('[data-kind]'))b.onclick=()=>{kind=b.dataset.kind;for(const item of document.querySelectorAll('[data-kind]'))item.setAttribute('aria-pressed',String(item===b));render()};
for(const b of document.querySelectorAll('[data-availability]'))b.onclick=()=>{availability=b.dataset.availability;for(const item of document.querySelectorAll('[data-availability]'))item.setAttribute('aria-pressed',String(item===b));render()};
window.addEventListener('focus',refresh);setInterval(()=>{if(!document.hidden)refresh()},15000);refresh();
</script></html>
