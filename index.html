<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>方案书桌 · Review Desk</title><link rel="stylesheet" href="/_preview/theme.css"><header class="topbar"><a class="brand" href="/"><span class="brand-mark">≋</span> Review Desk</a><span class="online">预览与批注 · 自动同步</span></header><main class="library"><section class="hero"><div><div class="eyebrow">A space for thoughtful review</div><h1>让每个想法，再清晰一点。</h1><p>阅读方案，留下批注，把修改意见一次带回对话。</p></div><div class="hero-side"><strong id="total">—</strong><span>份方案，等待好想法</span></div></section><div class="tools"><input id="search" aria-label="搜索方案" placeholder="搜索方案名称或项目目录…"><button id="refresh">↻ 刷新列表</button></div><div class="list-heading"><div class="filters" aria-label="文件类型"><button data-kind="all" aria-pressed="true">全部</button><button data-kind="HTML" aria-pressed="false">HTML</button><button data-kind="Markdown" aria-pressed="false">Markdown</button></div><span class="sort-label">↓ 最近更新优先</span><p id="status" role="status"></p></div><section id="list"></section><footer><span>选择方案开始批注 · 支持 HTML / Markdown</span><span>新文件自动收录，每 15 秒更新</span></footer></main><script>
let files=[],kind='all';const $=id=>document.getElementById(id);
function render(){const shown=files.filter(f=>(kind==='all'||f.kind===kind)&&f.name.toLowerCase().includes($('search').value.toLowerCase()));$('total').textContent=files.length;$('list').replaceChildren();for(const f of shown){const row=document.createElement('article'),icon=document.createElement('span'),info=document.createElement('div'),link=document.createElement('a'),meta=document.createElement('small'),time=document.createElement('time'),raw=document.createElement('a');row.className='file-row';icon.className='file-icon'+(f.kind==='Markdown'?' md':'');icon.textContent=f.kind==='Markdown'?'MD':'HTML';info.className='file-info';link.href='/_review?page='+encodeURIComponent(f.url);link.textContent=f.name.split('/').pop();meta.textContent=(f.name.includes('/')?f.name.slice(0,f.name.lastIndexOf('/'))+' · ':'')+f.kind;const date=new Date(f.modified*1000);time.dateTime=date.toISOString();time.className='file-date';time.textContent=date.toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false});time.title='修改时间：'+date.toLocaleString('zh-CN');raw.href=f.url;raw.textContent='预览 ↗';raw.className='raw';info.append(link,meta);row.append(icon,info,time,raw);$('list').append(row)}$('status').textContent=`${shown.length} / ${files.length} 份方案`;if(!shown.length){const empty=document.createElement('p');empty.className='empty';empty.textContent=files.length?'没有匹配的方案，试试其他关键词。':'还没有方案，将 HTML 或 Markdown 放入 preview 目录即可。';$('list').append(empty)}}
async function refresh(){try{const r=await fetch('/_preview/files',{cache:'no-store'});if(!r.ok)throw Error();files=await r.json();files.sort((a,b)=>b.modified-a.modified||a.name.localeCompare(b.name));render()}catch(e){$('status').textContent='列表加载失败，请刷新重试。'}}$('search').oninput=render;$('refresh').onclick=refresh;for(const b of document.querySelectorAll('[data-kind]'))b.onclick=()=>{kind=b.dataset.kind;for(const item of document.querySelectorAll('[data-kind]'))item.setAttribute('aria-pressed',String(item===b));render()};window.addEventListener('focus',refresh);setInterval(()=>{if(!document.hidden)refresh()},15000);refresh();
</script></html>
